[workspace]
members = [
  "crates/algo-wasm-core",
  "crates/algo-wasm-ffi"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/0xe25f/algowasm"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Release builds favour a small WASM binary. `panic = "abort"` matches what
# wasm32-unknown-unknown does anyway and drops the unwinding tables.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
