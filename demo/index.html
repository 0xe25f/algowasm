<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AlgoWASM Demo</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="title">
        <div>
          <p class="eyebrow">AlgoWASM</p>
          <h1 id="title">Generated House Engine</h1>
        </div>

        <div class="transport">
          <button id="start" type="button">Start</button>
          <button id="pause" type="button">Pause</button>
          <button id="stop" type="button">Stop</button>
          <button id="random" type="button">New Random</button>
        </div>

        <div class="track-settings">
          <label>
            Seed
            <input id="seedInput" type="text" inputmode="numeric" value="1995">
          </label>

          <label>
            Length
            <input id="lengthInput" type="text" inputmode="numeric" value="02:00" aria-describedby="lengthHint">
          </label>
        </div>
        <p id="lengthHint" class="hint">Use MM:SS, for example 02:30.</p>

        <label>
          Profile
          <select id="profileInput"></select>
        </label>

        <label>
          Energy
          <input id="energy" type="range" min="0" max="1" step="0.01" value="0.55">
        </label>

        <label>
          Intensity
          <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
        </label>

        <label>
          Mood
          <select id="mood">
            <option value="dark">Dark</option>
            <option value="bright">Bright</option>
            <option value="tense">Tense</option>
            <option value="calm">Calm</option>
          </select>
        </label>

        <output id="status" class="status">Ready.</output>
        <dl class="snapshot">
          <div>
            <dt>Time</dt>
            <dd id="time">00:00 / 02:00</dd>
          </div>
          <div>
            <dt>Section</dt>
            <dd id="section">intro</dd>
          </div>
          <div>
            <dt>Bar</dt>
            <dd id="bar">0</dd>
          </div>
          <div>
            <dt>Seed</dt>
            <dd id="seed">1995</dd>
          </div>
        </dl>

        <p class="footnote">
          <a href="https://github.com/0xe25f/algowasm">View the AlgoWASM source on GitHub</a>
        </p>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
