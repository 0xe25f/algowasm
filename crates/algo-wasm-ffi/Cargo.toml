[package]
name = "algo-wasm-ffi"
version = "1.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
algo-wasm-core = { path = "../algo-wasm-core" }

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
